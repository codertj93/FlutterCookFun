buildscript {
    repositories {
        google()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects { sub ->
    sub.buildDir = "${rootProject.buildDir}/${sub.name}"
    def applyAndroidFixes = { p ->
        if (p.plugins.hasPlugin('com.android.library') || p.plugins.hasPlugin('com.android.application')) {
            // 统一插件子模块 compileSdk，规避旧插件依赖旧 API 平台导致的编译失败
            p.android.compileSdkVersion(36)
            if (p.android.namespace == null) {
                p.android.namespace = p.group?.toString() ?: "com.missing.${p.name}"
            }
        }
    }
    if (!sub.state.executed) {
        sub.afterEvaluate(applyAndroidFixes)
    } else {
        applyAndroidFixes(sub)
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
